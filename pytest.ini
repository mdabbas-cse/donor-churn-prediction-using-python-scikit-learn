[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
filterwarnings =
    # Deprecations raised inside seaborn 0.13 by newer Matplotlib releases (not project code).
    ignore:vert. bool was deprecated:DeprecationWarning:seaborn
    ignore:The set_bad function will be deprecated:PendingDeprecationWarning:seaborn
